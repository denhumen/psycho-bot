{% extends "base.html" %}
{% block title %}Вхід{% endblock %}
{% block content %}
<article style="max-width: 26rem; margin: 2rem auto;">
  <h2>Вхід в адмінку</h2>
  {% if error %}<p class="flash-error">{{ error }}</p>{% endif %}
  <form method="post" action="/login">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label>Логін <input name="username" autocomplete="username" required></label>
    <label>Пароль <input type="password" name="password" autocomplete="current-password" required></label>
    <button type="submit">Увійти</button>
  </form>
</article>
{% endblock %}
