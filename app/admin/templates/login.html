{% extends "base.html" %}
{% block title %}Вхід{% endblock %}
{% block anonymous %}
<div class="auth">
  <div class="card">
    <div class="brand"><span class="brand-mark">✎</span><span>Дослідження<small>адмін-панель</small></span></div>
    <h1 style="margin-bottom:4px">Вхід</h1>
    <p class="muted" style="margin-bottom:18px">Лише для команди дослідження.</p>
    {% if error %}<div class="flash flash-error" role="alert">{{ error }}</div>{% endif %}
    <form method="post" action="/login">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <label><span>Логін</span><input name="username" autocomplete="username" required autofocus></label>
      <label><span>Пароль</span><input type="password" name="password" autocomplete="current-password" required></label>
      <button type="submit" class="btn" style="width:100%;margin-top:4px">Увійти</button>
    </form>
  </div>
</div>
{% endblock %}
